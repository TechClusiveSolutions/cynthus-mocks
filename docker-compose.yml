      - 'TZ=${TIME_ZONE}'
      - 'PYTHONPATH=/opt/app/shared/src:/opt/app/src'
      - 'PYTHONUNBUFFERED=1'
    volumes:
      - './containers/chat/bin:/opt/app/bin'
      - './containers/chat/src:/opt/app/src'
      - './containers/chat/test:/opt/app/test'
    expose:
      - '${WEB_PORT}/tcp'
    networks:
      - net
