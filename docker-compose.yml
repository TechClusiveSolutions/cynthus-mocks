version: '3.9'

services:
  analysis:
    hostname: mock-analysis
    container_name: cynthus-mock-analysis
    restart: unless-stopped
    image: cynthus/mock-analysis:latest
    build:
      context: ./containers/analysis
    environment:
      - 'TZ=${TIME_ZONE}'
      - 'PYTHONPATH=/opt/app/shared/src:/opt/app/src'
      - 'PYTHONUNBUFFERED=1'
    volumes:
      - './containers/analysis/bin:/opt/app/bin'
      - './containers/analysis/src:/opt/app/src'
      - './containers/analysis/test:/opt/app/test'
    expose:
      - '${API_PORT}/tcp'
    networks:
      - net
      - vnet
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:${API_PORT}/" ]
      start_period: 30s
      interval: 20s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file

  auth:
    hostname: mock-auth
    container_name: cynthus-mock-auth
    restart: unless-stopped
    image: cynthus/mock-auth:latest
