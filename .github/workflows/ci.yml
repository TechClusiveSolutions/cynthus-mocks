name: CI

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "*.md"
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run ruff
        run: uvx ruff@0.15.20 check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The shared messaging contracts live in a sibling repository. Services import them as `cynthus.messaging...`.
      - name: Check out cynthus-messaging-core
        uses: actions/checkout@v4
        with:
          repository: TechClusiveSolutions/cynthus-messaging-core
          ref: dev
          path: .deps/cynthus-messaging-core
          token: ${{ secrets.CYNTHUS_CI_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Each suite runs in its own interpreter: several containers define a package with the same name.
      - name: Unit tests with coverage gate
        env:
          CYNTHUS_MESSAGING_CORE_SRC: ${{ github.workspace }}/.deps/cynthus-messaging-core/src
        run: |
          set -e
          if [ -d containers ]; then
            for dir in containers/*/; do
              if [ -d "${dir}test" ]; then
                echo "=== ${dir} ==="
                (cd "${dir}" && python -m pytest --cov=src --cov-fail-under=75 -q)
              fi
            done
          elif [ -d test ]; then
            python -m pytest --cov=src --cov-fail-under=75 -q
          else
            echo "No unit tests in this repository."
          fi
